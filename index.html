<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>MELER</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .app {
      max-width: 520px;
      margin: auto;
      padding: 18px 16px 100px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .balance-box {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 9px 13px;
      text-align: right;
    }

    .balance-label {
      color: #777;
      font-size: 10px;
    }

    .balance {
      color: #ff2020;
      font-size: 17px;
      font-weight: 900;
      margin-top: 2px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .hero {
      background: linear-gradient(145deg, #1a1a1a, #0e0e0e);
      border: 1px solid #292929;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .hero-title {
      font-size: 25px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .hero-text {
      color: #888;
      font-size: 14px;
      line-height: 1.5;
    }

    .section-title {
      font-size: 21px;
      font-weight: 900;
      margin: 20px 0 12px;
    }

    .task {
      background: #131313;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      transition: .2s;
    }

    .task-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .task-description {
      color: #888;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 14px;
    }

    .task-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .reward {
      color: #ff2525;
      font-size: 15px;
      font-weight: 900;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 15px;
      background: #ff2020;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    .empty {
      background: #111;
      border: 1px solid #252525;
      border-radius: 18px;
      padding: 30px 16px;
      text-align: center;
      color: #777;
      line-height: 1.5;
    }

    .profile-card {
      background: linear-gradient(145deg, #171717, #0d0d0d);
      border: 1px solid #292929;
      border-radius: 22px;
      padding: 20px;
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      object-fit: cover;
      background: #222;
      border: 2px solid #292929;
    }

    .profile-name {
      font-size: 19px;
      font-weight: 900;
    }

    .profile-username {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 13px 0;
      border-top: 1px solid #252525;
      font-size: 14px;
    }

    .info-label {
      color: #777;
    }

    .info-value {
      font-weight: 700;
    }

    .profile-balance {
      background: #111;
      border: 1px solid #282828;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .profile-balance-label {
      color: #777;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .profile-balance-value {
      color: #ff2020;
      font-size: 28px;
      font-weight: 900;
    }

    .transaction {
      background: #131313;
      border: 1px solid #252525;
      border-radius: 15px;
      padding: 14px;
      margin-bottom: 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .transaction-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .transaction-title {
      font-size: 14px;
      font-weight: 800;
    }

    .transaction-date {
      color: #666;
      font-size: 11px;
    }

    .transaction-amount {
      color: #39d353;
      font-weight: 900;
      font-size: 15px;
    }

    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      background: rgba(10, 10, 10, .96);
      border-top: 1px solid #252525;
      display: flex;
      justify-content: center;
      z-index: 100;
    }

    .nav-inner {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      width: 33.33%;
      text-align: center;
      color: #666;
      font-size: 11px;
      cursor: pointer;
      padding: 10px 0;
    }

    .nav-icon {
      font-size: 21px;
      margin-bottom: 4px;
    }

    .nav-item.active {
      color: #ff2020;
    }

    .status {
      position: fixed;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      background: #191919;
      border: 1px solid #333;
      border-radius: 13px;
      padding: 10px 16px;
      font-size: 13px;
      color: #ddd;
      z-index: 200;
      display: none;
      white-space: nowrap;
    }

    .status.show {
      display: block;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="logo">
      MELER
    </div>

    <div class="balance-box">
      <div class="balance-label">
        BALANCE
      </div>

      <div
        class="balance"
        id="topBalance"
      >
        0 MELER
      </div>
    </div>

  </div>


  <!-- ================= HOME ================= -->

  <div
    id="homePage"
    class="page active"
  >

    <div class="hero">

      <div class="hero-title">
        Заробляй MELER
      </div>

      <div class="hero-text">
        Виконуй завдання, отримуй MELER
        та використовуй їх усередині платформи.
      </div>

    </div>

    <div class="section-title">
      MELER
    </div>

    <div class="profile-balance">

      <div class="profile-balance-label">
        Твій баланс
      </div>

      <div
        class="profile-balance-value"
        id="homeBalance"
      >
        0 MELER
      </div>

    </div>

  </div>


  <!-- ================= TASKS ================= -->

  <div
    id="tasksPage"
    class="page"
  >

    <div class="section-title">
      Завдання
    </div>

    <div id="tasks">
      <div class="empty">
        Завантаження...
      </div>
    </div>

  </div>


  <!-- ================= PROFILE ================= -->

  <div
    id="profilePage"
    class="page"
  >

    <div class="section-title">
      Профіль
    </div>

    <div class="profile-card">

      <div class="profile-top">

        <img
          id="avatar"
          class="avatar"
          src=""
          alt=""
        >

        <div>

          <div
            id="profileName"
            class="profile-name"
          >
            Користувач
          </div>

          <div
            id="profileUsername"
            class="profile-username"
          >
            Telegram
          </div>

        </div>

      </div>


      <div class="info-row">

        <div class="info-label">
          Telegram ID
        </div>

        <div
          id="telegramId"
          class="info-value"
        >
          —
        </div>

      </div>


      <div class="info-row">

        <div class="info-label">
          Баланс
        </div>

        <div
          id="profileBalance"
          class="info-value"
        >
          0 MELER
        </div>

      </div>

    </div>


    <div class="section-title">
      Історія MELER
    </div>

    <div id="transactions">

      <div class="empty">
        Завантаження історії...
      </div>

    </div>

  </div>

</div>


<!-- ================= NAVIGATION ================= -->

<div class="nav">

  <div class="nav-inner">

    <div
      class="nav-item active"
      data-page="homePage"
    >

      <div class="nav-icon">
        🏠
      </div>

      Головна

    </div>


    <div
      class="nav-item"
      data-page="tasksPage"
    >

      <div class="nav-icon">
        📋
      </div>

      Завдання

    </div>


    <div
      class="nav-item"
      data-page="profilePage"
    >

      <div class="nav-icon">
        👤
      </div>

      Профіль

    </div>

  </div>

</div>


<div
  id="status"
  class="status"
></div>


<script>

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

if (tg) {
  tg.ready();
  tg.expand();
}


const SUPABASE_URL =
  "https://znguvxqhsvxmewkybpaw.supabase.co";


/*
  ВСТАВ СЮДИ СВІЙ СТАРИЙ
  PUBLISHABLE / ANONYMOUS KEY.

  НЕ ВСТАВЛЯЙ SERVICE API KEY.
*/

const SUPABASE_KEY =
  "ВСТАВ_СВІЙ_ЗБЕРЕЖЕНИЙ_KEY";


const AUTH_FUNCTION =
  SUPABASE_URL +
  "/functions/v1/meler-auth";


const CHANNEL =
  "https://t.me/smertyVnischite";


let currentUser = null;


/*
=========================
API
=========================
*/

async function api(body) {

  const response =
    await fetch(
      AUTH_FUNCTION,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json",

          "apikey":
            SUPABASE_KEY
        },

        body:
          JSON.stringify(body)
      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    const error =
      new Error(
        data.error ||
        "Помилка сервера"
      );

    error.already_completed =
      data.already_completed ||
      false;

    throw error;
  }


  return data;
}


/*
=========================
STATUS
=========================
*/

function showStatus(text) {

  const element =
    document.getElementById(
      "status"
    );

  element.textContent =
    text;

  element.classList.add(
    "show"
  );


  setTimeout(() => {

    element.classList.remove(
      "show"
    );

  }, 2500);
}


/*
=========================
LOGIN
=========================
*/

async function login() {

  if (
    !tg ||
    !tg.initDataUnsafe
  ) {

    showStatus(
      "Відкрий MELER через Telegram"
    );

    return;
  }


  const telegramUser =
    tg.initDataUnsafe.user;


  if (
    !telegramUser ||
    !telegramUser.id
  ) {

    showStatus(
      "Telegram-користувача не знайдено"
    );

    return;
  }


  try {

    const result =
      await api({

        telegram_id:
          telegramUser.id,

        username:
          telegramUser.username ||
          null,

        first_name:
          telegramUser.first_name ||
          null,

        last_name:
          telegramUser.last_name ||
          null,

        photo_url:
          telegramUser.photo_url ||
          null,

        action:
          "login"

      });


    currentUser =
      result.user;


    updateProfile();

    await loadTasks();

    await loadTransactions();

  } catch (error) {

    console.error(error);

    showStatus(
      error.message
    );
  }
}


/*
=========================
UPDATE PROFILE
=========================
*/

function updateProfile() {

  if (!currentUser) {
    return;
  }


  const fullName =
    [
      currentUser.first_name,
      currentUser.last_name
    ]
      .filter(Boolean)
      .join(" ");


  document.getElementById(
    "profileName"
  ).textContent =
    fullName ||
    "Користувач";


  document.getElementById(
    "profileUsername"
  ).textContent =
    currentUser.username
      ? "@" +
        currentUser.username
      : "Telegram";


  document.getElementById(
    "telegramId"
  ).textContent =
    currentUser.telegram_id;


  updateBalance();


  const avatar =
    document.getElementById(
      "avatar"
    );


  if (
    currentUser.photo_url
  ) {

    avatar.src =
      currentUser.photo_url;

    avatar.style.display =
      "block";

  } else {

    avatar.style.display =
      "none";
  }

}


/*
=========================
BALANCE
=========================
*/

function updateBalance() {

  const balance =
    Number(
      currentUser?.balance ||
      0
    );


  document.getElementById(
    "topBalance"
  ).textContent =
    balance +
    " MELER";


  document.getElementById(
    "homeBalance"
  ).textContent =
    balance +
    " MELER";


  document.getElementById(
    "profileBalance"
  ).textContent =
    balance +
    " MELER";
}


/*
=========================
LOAD TASKS
=========================
*/

async function loadTasks() {

  if (!currentUser) {
    return;
  }


  const container =
    document.getElementById(
      "tasks"
    );


  container.innerHTML =
    `
      <div class="empty">
        Завантаження...
      </div>
    `;


  try {

    const result =
      await api({

        telegram_id:
          currentUser.telegram_id,

        action:
          "get_tasks"

      });


    renderTasks(
      result.tasks || []
    );

  } catch (error) {

    console.error(error);

    container.innerHTML =
      `
        <div class="empty">
          Не вдалося завантажити завдання.
        </div>
      `;
  }
}


/*
=========================
RENDER TASKS
=========================
*/

function renderTasks(tasks) {

  const container =
    document.getElementById(
      "tasks"
    );


  container.innerHTML =
    "";


  if (
    tasks.length === 0
  ) {

    container.innerHTML =
      `
        <div class="empty">
          🎉 Усі доступні завдання виконано!
          <br><br>
          Нові завдання з'являться пізніше.
        </div>
      `;

    return;
  }


  tasks.forEach(task => {

    const element =
      document.createElement(
        "div"
      );


    element.className =
      "task";


    element.id =
      "task-" +
      task.id;


    element.innerHTML =
      `

        <div class="task-title">
          ${escapeHtml(
            task.title
          )}
        </div>

        <div class="task-description">
          ${escapeHtml(
            task.description ||
            ""
          )}
        </div>

        <div class="task-bottom">

          <div class="reward">
            +${Number(
              task.reward
            )} MELER
          </div>

          <button
            onclick="startTask(
              ${Number(task.id)},
              this
            )"
          >
            Підписатися
          </button>

        </div>

      `;


    container.appendChild(
      element
    );

  });
}


/*
=========================
START TASK
=========================
*/

function startTask(
  taskId,
  button
) {

  button.disabled =
    true;


  if (tg) {

    tg.openTelegramLink(
      CHANNEL
    );

  } else {

    window.open(
      CHANNEL,
      "_blank"
    );

  }


  setTimeout(() => {

    button.disabled =
      false;

    button.textContent =
      "Перевірити підписку";


    button.onclick =
      () =>
        checkSubscription(
          taskId,
          button
        );

  }, 700);
}


/*
=========================
CHECK SUBSCRIPTION
=========================
*/

async function checkSubscription(
  taskId,
  button
) {

  button.disabled =
    true;


  button.textContent =
    "Перевіряємо...";


  try {

    const check =
      await api({

        telegram_id:
          currentUser.telegram_id,

        action:
          "check_subscription"

      });


    if (
      !check.subscribed
    ) {

      button.disabled =
        false;

      button.textContent =
        "Перевірити підписку";


      showStatus(
        "❌ Спочатку підпишись на канал"
      );

      return;
    }


    const result =
      await api({

        telegram_id:
          currentUser.telegram_id,

        action:
          "complete_task",

        task_id:
          taskId

      });


    if (
      result.already_completed
    ) {

      removeTask(
        taskId
      );

      return;
    }


    currentUser.balance =
      result.balance;


    updateBalance();


    showStatus(
      "🎉 +" +
      result.reward +
      " MELER"
    );


    removeTask(
      taskId
    );


    await loadTransactions();

  } catch (error) {

    console.error(error);


    if (
      error.already_completed
    ) {

      removeTask(
        taskId
      );

      return;
    }


    button.disabled =
      false;


    button.textContent =
      "Перевірити підписку";


    showStatus(
      error.message
    );
  }
}


/*
=========================
REMOVE TASK
=========================
*/

function removeTask(
  taskId
) {

  const element =
    document.getElementById(
      "task-" +
      taskId
    );


  if (!element) {
    return;
  }


  element.style.opacity =
    "0";

  element.style.transform =
    "scale(.95)";

  element.style.transition =
    ".2s";


  setTimeout(() => {

    element.remove();


    const remaining =
      document.querySelectorAll(
        ".task"
      );


    if (
      remaining.length === 0
    ) {

      document.getElementById(
        "tasks"
      ).innerHTML =
        `
          <div class="empty">
            🎉 Усі доступні завдання виконано!
            <br><br>
            Нові завдання з'являться пізніше.
          </div>
        `;
    }

  }, 200);
}


/*
=========================
LOAD TRANSACTIONS
=========================
*/

async function loadTransactions() {

  if (!currentUser) {
    return;
  }


  const container =
    document.getElementById(
      "transactions"
    );


  try {

    const result =
      await api({

        telegram_id:
          currentUser.telegram_id,

        action:
          "get_transactions"

      });


    renderTransactions(
      result.transactions ||
      []
    );

  } catch (error) {

    console.error(error);

    container.innerHTML =
      `
        <div class="empty">
          Не вдалося завантажити історію.
        </div>
      `;
  }
}


/*
=========================
RENDER TRANSACTIONS
=========================
*/

function renderTransactions(
  transactions
) {

  const container =
    document.getElementById(
      "transactions"
    );


  container.innerHTML =
    "";


  if (
    transactions.length === 0
  ) {

    container.innerHTML =
      `
        <div class="empty">
          Історія поки порожня.
        </div>
      `;

    return;
  }


  transactions.forEach(
    transaction => {

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "transaction";


      const date =
        formatDate(
          transaction.created_at
        );


      const amount =
        Number(
          transaction.amount || 0
        );


      element.innerHTML =
        `

          <div class="transaction-left">

            <div class="transaction-title">
              ${transactionTitle(
                transaction.type
              )}
            </div>

            <div class="transaction-date">
              ${date}
            </div>

          </div>

          <div class="transaction-amount">
            +${amount} MELER
          </div>

        `;


      container.appendChild(
        element
      );

    }
  );
}


/*
=========================
TRANSACTION TITLE
=========================
*/

function transactionTitle(
  type
) {

  if (
    type ===
    "task_reward"
  ) {

    return "Виконання завдання";
  }


  return "Нарахування MELER";
}


/*
=========================
DATE
=========================
*/

function formatDate(
  value
) {

  if (!value) {
    return "";
  }


  const date =
    new Date(value);


  return date.toLocaleString(
    "uk-UA",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",

      hour: "2-digit",
      minute: "2-digit"
    }
  );
}


/*
=========================
ESCAPE HTML
=========================
*/

function escapeHtml(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/*
=========================
NAVIGATION
=========================
*/

document
  .querySelectorAll(
    ".nav-item"
  )
  .forEach(item => {

    item.addEventListener(
      "click",
      async () => {

        const pageId =
          item.dataset.page;


        document
          .querySelectorAll(
            ".page"
          )
          .forEach(page => {

            page.classList.remove(
              "active"
            );

          });


        document
          .getElementById(
            pageId
          )
          .classList.add(
            "active"
          );


        document
          .querySelectorAll(
            ".nav-item"
          )
          .forEach(nav => {

            nav.classList.remove(
              "active"
            );

          });


        item.classList.add(
          "active"
        );


        if (
          pageId ===
          "profilePage"
        ) {

          await loadTransactions();
        }

      }

    );

  });


/*
=========================
START
=========================
*/

login();

</script>

</body>
</html>
