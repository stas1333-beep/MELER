<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>MELER</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #080808;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .app {
            max-width: 500px;
            margin: auto;
            padding: 20px 16px 100px;
        }

        /* LOGO */

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 3px;
            margin: 15px 0 25px;
            color: #ff1f1f;
        }

        /* BALANCE */

        .balance-card {
            position: relative;
            overflow: hidden;
            background: linear-gradient(145deg, #1a0808, #0e0e0e);
            border: 1px solid #3b1111;
            border-radius: 24px;
            padding: 26px 20px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(255, 0, 0, 0.08);
        }

        .balance-card::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            background: #ff0000;
            filter: blur(100px);
            opacity: 0.12;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
        }

        .balance-title {
            position: relative;
            color: #888;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .balance {
            position: relative;
            font-size: 42px;
            font-weight: 900;
        }

        .currency {
            position: relative;
            color: #ff2a2a;
            font-size: 16px;
            font-weight: 800;
        }

        /* BUTTONS */

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .button {
            border: none;
            border-radius: 16px;
            padding: 17px 10px;
            font-size: 15px;
            font-weight: 800;
            color: white;
            background: #171717;
            border: 1px solid #292929;
        }

        .button.primary {
            background: #e91515;
            border-color: #ff3030;
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.2);
        }

        .button:active {
            transform: scale(0.97);
        }

        /* SECTIONS */

        .section {
            margin-top: 28px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 12px;
        }

        /* TASK */

        .task {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;

            background: #111;
            border: 1px solid #252525;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 10px;
        }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .task-title {
            font-size: 15px;
            font-weight: 800;
        }

        .task-reward {
            color: #ff2929;
            font-size: 13px;
            font-weight: 700;
        }

        .task-button {
            flex-shrink: 0;
            border: none;
            background: #e91515;
            color: white;
            padding: 11px 14px;
            border-radius: 12px;
            font-weight: 800;
        }

        /* NAVIGATION */

        .bottom-nav {
            position: fixed;
            z-index: 100;
            bottom: 0;
            left: 0;
            right: 0;

            background: rgba(8, 8, 8, 0.96);
            border-top: 1px solid #262626;
            backdrop-filter: blur(15px);

            padding: 9px 10px;
        }

        .nav {
            max-width: 500px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .nav button {
            border: none;
            background: transparent;
            color: #666;
            padding: 9px 5px;
            font-size: 12px;
            font-weight: 700;
        }

        .nav button.active {
            color: #ff2020;
        }

        .nav-icon {
            display: block;
            font-size: 20px;
            margin-bottom: 3px;
        }

        /* NOTIFICATION */

        .notice {
            margin-top: 18px;
            padding: 14px;
            border-radius: 15px;
            background: #160909;
            border: 1px solid #351010;
            color: #aaa;
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="logo">
        MELER
    </div>

    <div class="balance-card">

        <div class="balance-title">
            Ваш баланс
        </div>

        <div>
            <span class="balance" id="balance">0</span>
            <span class="currency">MELER</span>
        </div>

    </div>

    <div class="buttons">

        <button class="button primary" onclick="showTasks()">
            🎁 Заробити
        </button>

        <button class="button" onclick="showGames()">
            🎮 Грати
        </button>

    </div>

    <div class="section">

        <div class="section-title">
            🔥 Завдання
        </div>

        <div class="task">

            <div class="task-info">

                <div class="task-title">
                    📢 Підписатися на канал
                </div>

                <div class="task-reward">
                    +100 MELER
                </div>

            </div>

            <button class="task-button" onclick="completeDemoTask()">
                Отримати
            </button>

        </div>

    </div>

    <div class="section">

        <div class="section-title">
            🎮 Мініігри
        </div>

        <div class="task">

            <div class="task-info">

                <div class="task-title">
                    🎲 Dice
                </div>

                <div class="task-reward">
                    Демо-гра
                </div>

            </div>

            <button class="task-button" onclick="playDemoGame()">
                Грати
            </button>

        </div>

    </div>

    <div class="notice">
        Виконуй завдання, отримуй MELER та використовуй їх у доступних розвагах і винагородах.
    </div>

</div>

<div class="bottom-nav">

    <div class="nav">

        <button class="active" onclick="home()">
            <span class="nav-icon">🏠</span>
            Головна
        </button>

        <button onclick="showTasks()">
            <span class="nav-icon">🎁</span>
            Завдання
        </button>

        <button onclick="showGames()">
            <span class="nav-icon">🎮</span>
            Ігри
        </button>

    </div>

</div>

<script>

let balance = 0;

function updateBalance() {
    document.getElementById("balance").textContent = balance;
}

function completeDemoTask() {

    balance += 100;

    updateBalance();

    alert("🔥 +100 MELER");
}

function playDemoGame() {

    if (balance < 10) {
        alert("Потрібно мінімум 10 MELER.");
        return;
    }

    balance -= 10;

    const win = Math.random() > 0.5;

    if (win) {
        balance += 20;
        alert("🎉 Ви виграли 20 MELER!");
    } else {
        alert("😔 Не пощастило.");
    }

    updateBalance();
}

function showTasks() {
    alert("🎁 Тут будуть завдання.");
}

function showGames() {
    alert("🎮 Тут будуть мініігри.");
}

function home() {
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

if (window.Telegram && Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
}

updateBalance();

</script>

</body>
</html>
