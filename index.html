<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>MELER</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 20px 16px 100px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .balance {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 10px 14px;
      text-align: right;
    }

    .balance-label {
      font-size: 11px;
      color: #888;
    }

    .balance-value {
      color: #ff1f1f;
      font-size: 18px;
      font-weight: 800;
    }

    .profile {
      background: linear-gradient(
        145deg,
        #171717,
        #0d0d0d
      );
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      object-fit: cover;
      background: #222;
    }

    .name {
      font-size: 18px;
      font-weight: 800;
    }

    .username {
      margin-top: 4px;
      color: #888;
      font-size: 13px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 800;
      margin: 22px 0 12px;
    }

    .task {
      background: #131313;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .task-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .task-description {
      color: #888;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 14px;
    }

    .task-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .reward {
      color: #ff3030;
      font-weight: 800;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      background: #ff2020;
      color: white;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    .empty {
      text-align: center;
      padding: 35px 15px;
      background: #111;
      border: 1px solid #252525;
      border-radius: 18px;
      color: #777;
      line-height: 1.5;
    }

    .status {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #151515;
      border: 1px solid #303030;
      border-radius: 14px;
      padding: 10px 16px;
      font-size: 13px;
      color: #aaa;
      z-index: 100;
      display: none;
    }

    .status.show {
      display: block;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">MELER</div>

    <div class="balance">
      <div class="balance-label">
        BALANCE
      </div>

      <div
        class="balance-value"
        id="balance"
      >
        0 MELER
      </div>
    </div>
  </div>

  <div class="profile">

    <div class="profile-top">

      <img
        id="avatar"
        class="avatar"
        src=""
        alt=""
      >

      <div>
        <div
          id="name"
          class="name"
        >
          Користувач
        </div>

        <div
          id="username"
          class="username"
        >
          Telegram
        </div>
      </div>

    </div>

  </div>

  <div class="section-title">
    Завдання
  </div>

  <div id="tasks"></div>

</div>

<div
  id="status"
  class="status"
></div>

<script>

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

if (tg) {
  tg.ready();
  tg.expand();
}

const SUPABASE_URL =
  "https://znguvxqhsvxmewkybpaw.supabase.co";

/*
  ВСТАВ СЮДИ СВІЙ PUBLISHABLE
  АБО ANONYMOUS KEY.

  НЕ ВСТАВЛЯЙ SERVICE ROLE KEY.
*/

const SUPABASE_KEY =
  "sb_publishable_FVOO6zTiLHNc7PE_AWcUNQ_jNI5W2PR";

const AUTH_FUNCTION =
  SUPABASE_URL +
  "/functions/v1/meler-auth";

const CHANNEL =
  "https://t.me/smertyVnischite";

let currentUser = null;

async function api(body) {

  const response = await fetch(
    AUTH_FUNCTION,
    {
      method: "POST",

      headers: {
        "Content-Type":
          "application/json",

        "apikey":
          SUPABASE_KEY
      },

      body:
        JSON.stringify(body)
    }
  );

  const data =
    await response.json();

  if (!response.ok) {
    throw new Error(
      data.error ||
      "Помилка сервера"
    );
  }

  return data;
}

/*
  =========================
  STATUS
  =========================
*/

function showStatus(text) {

  const element =
    document.getElementById(
      "status"
    );

  element.textContent = text;
  element.classList.add("show");

  setTimeout(() => {
    element.classList.remove(
      "show"
    );
  }, 2500);
}

/*
  =========================
  LOGIN
  =========================
*/

async function login() {

  if (!tg || !tg.initDataUnsafe) {
    showStatus(
      "Відкрий MELER через Telegram"
    );

    return;
  }

  const user =
    tg.initDataUnsafe.user;

  if (!user || !user.id) {
    showStatus(
      "Telegram-користувача не знайдено"
    );

    return;
  }

  try {

    const result =
      await api({

        telegram_id:
          user.id,

        username:
          user.username ||
          null,

        first_name:
          user.first_name ||
          null,

        last_name:
          user.last_name ||
          null,

        photo_url:
          user.photo_url ||
          null,

        action:
          "login"
      });

    currentUser =
      result.user;

    updateProfile();

    await loadTasks();

  } catch (error) {

    console.error(error);

    showStatus(
      error.message
    );
  }
}

/*
  =========================
  PROFILE
  =========================
*/

function updateProfile() {

  if (!currentUser) {
    return;
  }

  const name =
    [
      currentUser.first_name,
      currentUser.last_name
    ]
      .filter(Boolean)
      .join(" ");

  document.getElementById(
    "name"
  ).textContent =
    name ||
    "Користувач";

  document.getElementById(
    "username"
  ).textContent =
    currentUser.username
      ? "@" +
        currentUser.username
      : "Telegram";

  document.getElementById(
    "balance"
  ).textContent =
    Number(
      currentUser.balance || 0
    ) +
    " MELER";

  const avatar =
    document.getElementById(
      "avatar"
    );

  if (currentUser.photo_url) {

    avatar.src =
      currentUser.photo_url;

  } else {

    avatar.style.display =
      "none";
  }
}

/*
  =========================
  LOAD TASKS
  =========================
*/

async function loadTasks() {

  if (!currentUser) {
    return;
  }

  const container =
    document.getElementById(
      "tasks"
    );

  container.innerHTML = "";

  try {

    const result =
      await api({

        telegram_id:
          currentUser.telegram_id,

        action:
          "get_tasks"
      });

    const tasks =
      result.tasks || [];

    renderTasks(tasks);

  } catch (error) {

    console.error(error);

    container.innerHTML = `
      <div class="empty">
        Не вдалося завантажити завдання.
      </div>
    `;
  }
}

/*
  =========================
  RENDER TASKS
  =========================
*/

function renderTasks(tasks) {

  const container =
    document.getElementById(
      "tasks"
    );

  container.innerHTML = "";

  /*
    Якщо завдань більше немає —
    показуємо повідомлення.
  */

  if (tasks.length === 0) {

    container.innerHTML = `
      <div class="empty">
        🎉 Усі доступні завдання виконано!<br><br>
        Нові завдання з'являться тут пізніше.
      </div>
    `;

    return;
  }

  tasks.forEach(task => {

    const element =
      document.createElement(
        "div"
      );

    element.className =
      "task";

    element.id =
      "task-" + task.id;

    element.innerHTML = `

      <div class="task-title">
        ${escapeHtml(
          task.title
        )}
      </div>

      <div class="task-description">
        ${escapeHtml(
          task.description ||
          ""
        )}
      </div>

      <div class="task-bottom">

        <div class="reward">
          +${Number(
            task.reward
          )} MELER
        </div>

        <button
          onclick="startTask(
            ${Number(task.id)},
            this
          )"
        >
          Підписатися
        </button>

      </div>
    `;

    container.appendChild(
      element
    );
  });
}

/*
  =========================
  START TASK
  =========================
*/

async function startTask(
  taskId,
  button
) {

  button.disabled = true;

  /*
    Відкриваємо канал
  */

  if (tg) {

    tg.openTelegramLink(
      CHANNEL
    );

  } else {

    window.open(
      CHANNEL,
      "_blank"
    );
  }

  /*
    Через невелику паузу
    змінюємо кнопку
  */

  setTimeout(() => {

    button.disabled = false;

    button.textContent =
      "Перевірити підписку";

    button.onclick =
      () => checkSubscription(
        taskId,
        button
      );

  }, 700);

}

/*
  =========================
  CHECK SUBSCRIPTION
  =========================
*/

async function checkSubscription(
  taskId,
  button
) {

  button.disabled = true;

  button.textContent =
    "Перевіряємо...";

  try {

    /*
      Спочатку перевіряємо,
      чи є підписка.
    */

    const check =
      await api({

        telegram_id:
          currentUser.telegram_id,

        action:
          "check_subscription"
      });

    if (!check.subscribed) {

      button.disabled =
        false;

      button.textContent =
        "Перевірити підписку";

      showStatus(
        "❌ Ти ще не підписаний на канал"
      );

      return;
    }

    /*
      Підписка є.
      Намагаємося виконати завдання.
    */

    const result =
      await api({

        telegram_id:
          currentUser.telegram_id,

        action:
          "complete_task",

        task_id:
          taskId
      });

    if (
      result.already_completed
    ) {

      /*
        Навіть якщо користувач
        якимось чином повторив запит —
        завдання прибираємо.
      */

      removeTask(
        taskId
      );

      return;
    }

    if (!result.success) {

      throw new Error(
        result.error ||
        "Не вдалося виконати завдання"
      );
    }

    /*
      Оновлюємо баланс
    */

    currentUser.balance =
      result.balance;

    updateProfile();

    showStatus(
      "🎉 +" +
      result.reward +
      " MELER"
    );

    /*
      ГОЛОВНЕ:
      одразу прибираємо завдання
    */

    removeTask(
      taskId
    );

  } catch (error) {

    console.error(error);

    button.disabled =
      false;

    button.textContent =
      "Перевірити підписку";

    showStatus(
      error.message
    );
  }
}

/*
  =========================
  REMOVE TASK
  =========================
*/

function removeTask(taskId) {

  const task =
    document.getElementById(
      "task-" + taskId
    );

  if (task) {

    task.style.opacity =
      "0";

    task.style.transform =
      "scale(0.95)";

    task.style.transition =
      "0.2s";

    setTimeout(() => {

      task.remove();

      const remaining =
        document.querySelectorAll(
          ".task"
        );

      if (
        remaining.length === 0
      ) {

        document.getElementById(
          "tasks"
        ).innerHTML = `
          <div class="empty">
            🎉 Усі доступні завдання виконано!<br><br>
            Нові завдання з'являться тут пізніше.
          </div>
        `;
      }

    }, 200);
  }
}

/*
  =========================
  ESCAPE HTML
  =========================
*/

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

/*
  =========================
  START
  =========================
*/

login();

</script>

</body>
</html>
