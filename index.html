<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MELER</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

.app{
  max-width:500px;
  margin:auto;
  padding:20px 16px 100px;
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:900;
  letter-spacing:4px;
  margin:15px 0 8px;
  color:#ff1f1f;
}

.welcome{
  text-align:center;
  color:#888;
  font-size:14px;
  margin-bottom:24px;
}

.balance-card{
  background:linear-gradient(145deg,#1a0808,#0e0e0e);
  border:1px solid #3b1111;
  border-radius:24px;
  padding:28px 20px;
  text-align:center;
}

.balance-title{
  color:#888;
  font-size:13px;
  margin-bottom:10px;
}

.balance{
  font-size:42px;
  font-weight:900;
}

.currency{
  color:#ff2a2a;
  font-size:16px;
  font-weight:800;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:15px;
}

.button{
  border:none;
  border-radius:16px;
  padding:17px 10px;
  font-size:15px;
  font-weight:800;
  color:white;
  background:#171717;
  border:1px solid #292929;
}

.button.primary{
  background:#e91515;
}

.section{
  margin-top:28px;
}

.section-title{
  font-size:20px;
  font-weight:900;
  margin-bottom:12px;
}

.task{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:#111;
  border:1px solid #252525;
  border-radius:18px;
  padding:16px;
  margin-bottom:10px;
}

.task-title{
  font-size:15px;
  font-weight:800;
}

.task-reward{
  color:#ff2929;
  font-size:13px;
  font-weight:700;
  margin-top:6px;
}

.task-button{
  border:none;
  background:#e91515;
  color:white;
  padding:11px 14px;
  border-radius:12px;
  font-weight:800;
}

.status{
  text-align:center;
  color:#777;
  font-size:12px;
  margin-top:18px;
  min-height:20px;
}

.debug{
  margin-top:15px;
  padding:12px;
  background:#151515;
  border:1px solid #333;
  border-radius:12px;
  color:#aaa;
  font-size:11px;
  word-break:break-word;
}
</style>
</head>

<body>

<div class="app">

  <div class="logo">MELER</div>

  <div class="welcome" id="welcome">
    Підключення...
  </div>

  <div class="balance-card">

    <div class="balance-title">
      Ваш баланс
    </div>

    <div>
      <span class="balance" id="balance">0</span>
      <span class="currency"> MELER</span>
    </div>

  </div>

  <div class="buttons">

    <button class="button primary" onclick="showTasks()">
      🎁 Заробити
    </button>

    <button class="button" onclick="showGames()">
      🎮 Грати
    </button>

  </div>

  <div class="section" id="tasksSection">

    <div class="section-title">
      🔥 Завдання
    </div>

    <div class="task">

      <div>
        <div class="task-title">
          📢 Підписатися на канал
        </div>

        <div class="task-reward">
          +100 MELER
        </div>
      </div>

      <button
        class="task-button"
        id="taskButton"
        onclick="completeTask()">
        Отримати
      </button>

    </div>

  </div>

  <div class="section" id="gamesSection">

    <div class="section-title">
      🎮 Мініігри
    </div>

    <div class="task">

      <div>
        <div class="task-title">
          🎲 Dice
        </div>

        <div class="task-reward">
          Демо-гра
        </div>
      </div>

      <button
        class="task-button"
        onclick="playGame()">
        Грати
      </button>

    </div>

  </div>

  <div class="status" id="status">
  </div>

  <div class="debug" id="debug">
    Перевірка підключення...
  </div>

</div>

<script>

const SUPABASE_URL =
"https://znguvxqhsvxmewkybpaw.supabase.co";

const SUPABASE_KEY =
"ТУТ_МАЄ_БУТИ_ТВІЙ_КЛЮЧ";

const AUTH_FUNCTION =
SUPABASE_URL + "/functions/v1/meler-auth";

let telegramUser = null;
let balance = 0;


// =====================================
// TELEGRAM
// =====================================

function initTelegram(){

  if(!window.Telegram || !Telegram.WebApp){

    setDebug("❌ Telegram WebApp не знайдено");

    return false;
  }

  Telegram.WebApp.ready();
  Telegram.WebApp.expand();

  telegramUser =
    Telegram.WebApp.initDataUnsafe?.user || null;

  if(!telegramUser){

    setDebug(
      "❌ Telegram користувач не знайдений"
    );

    return false;
  }

  setDebug(
    "Telegram OK | ID: " +
    telegramUser.id
  );

  return true;
}


// =====================================
// DEBUG
// =====================================

function setDebug(text){

  document.getElementById("debug").textContent =
    text;

}

function setStatus(text){

  document.getElementById("status").textContent =
    text;

}


// =====================================
// BALANCE
// =====================================

function updateBalance(){

  document.getElementById("balance").textContent =
    Number(balance).toLocaleString("uk-UA");

}


// =====================================
// LOGIN
// =====================================

async function login(){

  if(!initTelegram()){

    document.getElementById("welcome").textContent =
      "Помилка Telegram";

    return;
  }

  document.getElementById("welcome").textContent =
    "Привіт, " +
    (telegramUser.first_name || "користувач") +
    " 👋";

  setStatus("Підключення до MELER...");

  try{

    setDebug("Відправляємо запит до Supabase...");

    const response =
      await fetch(AUTH_FUNCTION, {

        method:"POST",

        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        },

        body:JSON.stringify({

          telegram_id:telegramUser.id,

          username:
            telegramUser.username || null,

          first_name:
            telegramUser.first_name || null,

          last_name:
            telegramUser.last_name || null,

          photo_url:
            telegramUser.photo_url || null,

          action:"login"

        })

      });


    const text =
      await response.text();

    setDebug(
      "Supabase HTTP " +
      response.status +
      " | " +
      text
    );


    let data;

    try{

      data = JSON.parse(text);

    }catch(e){

      throw new Error(
        "Supabase повернув неправильну відповідь"
      );

    }


    if(!response.ok || !data.success){

      throw new Error(
        data.error ||
        "Помилка авторизації"
      );

    }


    balance =
      Number(data.user.balance || 0);

    updateBalance();

    setStatus("Підключено ✓");

    setDebug(
      "✅ Підключено. Telegram ID: " +
      telegramUser.id
    );

  }
  catch(error){

    console.error(error);

    setStatus("Помилка підключення");

    setDebug(
      "❌ ПОМИЛКА: " +
      error.message
    );

  }

}


// =====================================
// COMPLETE TASK
// =====================================

async function completeTask(){

  if(!telegramUser){

    alert("Відкрий MELER через Telegram.");

    return;
  }

  const button =
    document.getElementById("taskButton");

  button.disabled = true;
  button.textContent = "Обробка...";

  try{

    const response =
      await fetch(AUTH_FUNCTION, {

        method:"POST",

        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        },

        body:JSON.stringify({

          telegram_id:telegramUser.id,

          action:"complete_task",

          task_id:1

        })

      });


    const data =
      await response.json();


    if(!response.ok || !data.success){

      throw new Error(
        data.error ||
        "Не вдалося виконати завдання"
      );

    }


    balance =
      Number(data.balance);

    updateBalance();

    button.textContent =
      "Виконано ✓";

    setStatus(
      "Баланс збережено ✓"
    );

    alert(
      "🔥 +" +
      data.reward +
      " MELER"
    );

  }
  catch(error){

    console.error(error);

    button.disabled = false;
    button.textContent = "Отримати";

    alert(error.message);

  }

}


// =====================================
// DEMO GAME
// =====================================

function playGame(){

  alert(
    "🎮 Демо-гра буде підключена наступним кроком."
  );

}


// =====================================
// NAVIGATION
// =====================================

function showTasks(){

  document
    .getElementById("tasksSection")
    .scrollIntoView({
      behavior:"smooth"
    });

}


function showGames(){

  document
    .getElementById("gamesSection")
    .scrollIntoView({
      behavior:"smooth"
    });

}


// =====================================
// START
// =====================================

updateBalance();

login();

</script>

</body>
</html>
